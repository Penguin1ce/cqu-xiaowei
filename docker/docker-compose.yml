# 本地开发依赖服务：MySQL / Redis / Milvus
# 启动：docker compose -f docker/docker-compose.yml up -d
# Milvus 使用官方单容器模式（内嵌 etcd、本地存储），不需要单独部署 etcd 和 minio。
# 数据保存在 Docker 命名卷中，用 `down -v` 可清空全部数据。

name: cqu-affairs

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cqu_affairs
      MYSQL_USER: cqu
      MYSQL_PASSWORD: cqu
      TZ: Asia/Shanghai
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports: ["3306:3306"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -ucqu, -pcqu]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    ports: ["6379:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10

  milvus:
    image: milvusdb/milvus:v3.0.3
    command: [milvus, run, standalone]
    security_opt: [seccomp:unconfined]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "19530:19530"   # gRPC / SDK
      - "9091:9091"     # 健康检查与 WebUI（http://127.0.0.1:9091/webui/）
    volumes:
      - milvus:/var/lib/milvus
      - ./milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./milvus/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

volumes:
  mysql:
  redis:
  milvus:
